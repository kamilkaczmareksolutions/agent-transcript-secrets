- id: agent-secrets
  name: agent-secrets
  description: Block commits when agent transcripts or settings files contain secrets
  entry: agent-secrets scan
  language: python
  pass_filenames: true
  files: (\.jsonl$|settings[^/]*\.json$|(^|/)(\.claude|agent-transcripts|archived_sessions)/|sessions/[0-9]{4}/[0-9]{2}/[0-9]{2}/rollout-)
