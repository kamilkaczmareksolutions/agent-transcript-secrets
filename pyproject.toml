[project]
name = "agent-transcript-secrets"
version = "0.1.0"
description = "Find and redact secrets in local AI agent transcripts and settings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kamil Kaczmarek", email = "contact@kamilkaczmareksolutions.com" }]
keywords = [
    "secrets",
    "security",
    "claude-code",
    "codex",
    "cursor",
    "transcripts",
    "pre-commit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/kamilkaczmareksolutions/agent-transcript-secrets"
Repository = "https://github.com/kamilkaczmareksolutions/agent-transcript-secrets"
Issues = "https://github.com/kamilkaczmareksolutions/agent-transcript-secrets/issues"
Changelog = "https://github.com/kamilkaczmareksolutions/agent-transcript-secrets/releases"

[project.scripts]
agent-secrets = "agent_secrets.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
